[project]
name = "fastsmoothbuildings"
# the version of the Modelica library (its version annotation), written here too by scripts/bump_version.py: a
# static version lets uv resolve trano, which depends on this package, in the study group
version = "0.5.0"
description = "Smooth, event-free Modelica models of buildings and their systems, close to Buildings and translated into an explicit CasADi ODE for model predictive control."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Ando Andriamamonjy", email = "andoludovic.andriamamonjy@gmail.com" }]
keywords = [
    "modelica",
    "building energy simulation",
    "model predictive control",
    "casadi",
    "rumoca",
    "optimal control",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/andoludo/FastSmoothBuildings"
Repository = "https://github.com/andoludo/FastSmoothBuildings"
Issues = "https://github.com/andoludo/FastSmoothBuildings/issues"
Changelog = "https://github.com/andoludo/FastSmoothBuildings/blob/main/CHANGELOG.md"

[dependency-groups]
# test: the layout, the bundle and the OpenModelica tests; rumoca: the translation into CasADi (the release on PyPI;
# the library also translates with the commit 33c2114 of rumoca's main branch); lint: the static checks
test = ["numpy>=2,<3", "pytest>=9.0.3,<10"]
rumoca = ["casadi>=3.6,<4", "rumoca>=0.10.3,<0.11"]
lint = [{ include-group = "test" }, "mypy>=2.1.0,<3", "ruff>=0.15.16,<0.16"]
dev = [{ include-group = "lint" }, { include-group = "rumoca" }]
# study: the study against Buildings with the models trano generates (study/), and the documentation site
study = [
    { include-group = "rumoca" },
    "trano>=0.64,<1",
    "trano-simulate>=0.2.0,<1",
    "trano-optimization>=0.3.0,<1",
    "pandas>=2.2,<3",
    "plotly>=6,<7",
    "pyyaml>=6,<7",
    "pandas-stubs>=2.2,<3",
    "types-pyyaml>=6,<7",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.5.42,<10",
    "mkdocs-gen-files>=0.5,<0.6",
    "mkdocs-literate-nav>=0.6,<0.7",
    "markdown-include>=0.8.1,<0.9",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastsmoothbuildings"]

[tool.hatch.build.targets.wheel.force-include]
"FastSmoothBuildings" = "fastsmoothbuildings/modelica/FastSmoothBuildings"

[tool.hatch.build.targets.sdist]
include = ["/FastSmoothBuildings", "/src", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "openmodelica: simulations in OpenModelica (Docker and the official OpenModelica image)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["docs/migration/phase0"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PL", "PERF", "C4", "PIE", "FURB", "N", "ANN", "S", "PT", "C901"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S603"]
# the study was written in trano, whose rules allow the imports inside functions (optional dependencies, Docker)
"study/**" = ["PLC0415", "PLR2004"]
"tests/study/**" = ["S101", "PLR2004", "PLC0415"]

[tool.mypy]
strict = true
python_version = "3.11"
# the study needs trano (the study group): its own job checks it, mypy study tests/study
files = ["src", "tests/*.py", "scripts"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["casadi", "casadi.*", "rumoca", "rumoca.*", "plotly", "plotly.*", "buildingspy", "buildingspy.*", "mkdocs_gen_files"]
ignore_missing_imports = true
