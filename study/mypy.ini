# mypy for the study (mypy --config-file study/mypy.ini), with the study group installed: as trano checks it, strict
# with the pydantic plugin, reading trano, which carries no py.typed marker
[mypy]
plugins = pydantic.mypy
strict = true
python_version = 3.11
files = study, tests/study
mypy_path = src
explicit_package_bases = true

[mypy-trano.*]
follow_untyped_imports = true

[mypy-trano_simulate.*,trano_optimization.*]
follow_untyped_imports = true

[mypy-casadi.*,rumoca.*,plotly.*,buildingspy.*]
ignore_missing_imports = true
