name: Release

# As trano's pipeline: every change merged into main is released once CI passes on it.
#
# tag      after CI succeeds on a push to main: the version of the library (the version annotation of
#          FastSmoothBuildings/package.mo) is released as it is when it has no tag yet (the first release, or a
#          version raised by hand); otherwise its minor version is raised and committed to main ("Auto-increment
#          release version"). The tag v<version> is pushed with ACCESS_TOKEN: a tag pushed with GITHUB_TOKEN would
#          start no workflow.
# publish  on the tag: the wheel and the sdist on PyPI, then the GitHub release with the notes of CHANGELOG.md (or
#          the commits since the previous tag) and the library as a zip for OpenModelica and Dymola.
#
# Secrets: ACCESS_TOKEN, a personal access token allowed to push to this repository (as trano's); PYPI_API_TOKEN, a
# PyPI API token of the account (as trano's; scoped to the whole account for the first upload, which creates the
# project on PyPI).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       !startsWith(github.event.workflow_run.head_commit.message, 'Auto-increment release version'))
    runs-on: ubuntu-latest
    concurrency:
      group: release-tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          ref: main
          fetch-depth: 0
      - name: Tag the version to release
        env:
          TESTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "${TESTED}" ] && [ "$(git rev-parse HEAD)" != "${TESTED}" ]; then
            echo "main has moved on since ${TESTED}: the CI run of its new head releases it"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version=$(python3 scripts/bump_version.py)
          if git rev-parse -q --verify "refs/tags/v${version}" > /dev/null; then
            version=$(python3 scripts/bump_version.py minor)
            git commit -am "Auto-increment release version to ${version}"
            git push origin HEAD:main
          fi
          git tag -a "v${version}" -m "FastSmoothBuildings ${version}"
          git push origin "v${version}"
          echo "Tagged v${version}" >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: The tag is the version of the library
        run: |
          version=$(python3 scripts/bump_version.py)
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME}, library ${version}"; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: The library as a zip, the notes of the release
        run: |
          mkdir modelica
          zip -qr "modelica/FastSmoothBuildings-${VERSION}.zip" FastSmoothBuildings LICENSE
          awk -v version="${VERSION}" '/^## / { keep = index($0, "## " version) == 1; next } keep' CHANGELOG.md \
            > notes.md
          if [ ! -s notes.md ]; then
            previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2> /dev/null || true)
            git log --no-merges --pretty=format:"- %s" "${previous:+${previous}..}${GITHUB_REF_NAME}" > notes.md
          fi
      - name: Publish on PyPI
        run: uv publish dist/*
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FastSmoothBuildings ${{ env.VERSION }}
          body_path: notes.md
          files: |
            dist/*
            modelica/*.zip
